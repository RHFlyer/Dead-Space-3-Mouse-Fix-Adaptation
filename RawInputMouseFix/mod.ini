; Raw Input Mouse Fix's manifest: what the DS3 Mod Loader and its Mods panel need to know about the add-on.
; Format: sdk\README.md. Comments go on their own lines (a ; after a value is part of the value).
; Based on the Raw Input Mouse Fix by slopkhayzo (MIT, LICENSE-RawInputMouseFix.txt), moved onto the mod SDK.

[mod]
name=Raw Input Mouse Fix
; The [modules] key in ds3_mods.ini, the same as when the fix shipped inside the loader, so a player's switch is kept.
; Don't change it.
id=raw_mouse
author=slopkhayzo (MIT), SDK port: RHFlyer
version=1.0.0
; The oldest DS3 Mod Loader this add-on works with. An older loader says so instead of loading it.
min_loader=1.0.0
description=1:1 mouse aim without the game's acceleration and camera smoothing. Based on slopkhayzo's fix (MIT). F6 reloads its settings, F7 / F8 toggle the patches.
file=DS3RawMouse.asi
; Written with every key and its default on the first start if it is missing. Hand-edit it for the advanced keys
; (Hotkeys, Diagnostics, ThirdPersonSensitivityX/Y, AimSensitivityX/Y); F6 in game re-reads it.
ini=ds3_raw_mouse.ini

; Each [setting.*] section is one row in the Mods panel, in this order. Every one applies at once: the add-on re-reads
; ds3_raw_mouse.ini when the panel changes a row (DS3ModSettingsChanged in raw_mouse.cpp).
; Defaults are the add-on's own (it reads 1 / true / yes / on as on): the game's slider sets the speed, and slider
; 50 means 0.50. The standalone fix started at 1.00 with the slider off.

[setting.slider]
section=Mouse
key=UseGameSlider
kind=bool
values=true,false
default=true
label=Use the game's sensitivity slider
help=On: the mouse sensitivity slider in the game's own settings sets the speed (50 = the multiplier below).

[setting.multiplier]
section=Mouse
key=SensitivityMultiplier
kind=float
min=0.10
max=5.00
step=0.05
default=0.50
label=Sensitivity multiplier
help=Overall mouse speed of the fix.

[setting.raw]
section=Patch
key=RawInput
kind=bool
values=true,false
default=true
label=Raw mouse input
help=1:1 mouse movement, without the game's acceleration.

[setting.smoothing]
section=Patch
key=RemoveCameraSmoothing
kind=bool
values=true,false
default=true
label=Remove camera smoothing
help=The camera follows the mouse at once instead of easing after it.
